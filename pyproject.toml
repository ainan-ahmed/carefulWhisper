[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project]
name = "carefulWhisper"
version = "0.1.0"
description = "Project setup scaffold for a local-first dictation app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "faster-whisper>=1.2.1",
    "sounddevice>=0.5.1",
    "tomli-w>=1.2.0",
    "soundfile>=0.13.1",
    "resampy>=0.4.3",
    "pyperclip>=1.9.0",
    "pynput>=1.7.7",
    "evdev>=1.6.0",
    "text2num>=3.0.0",
    "ftfy>=6.0.0",
]

[tool.uv]
package = true

[project.scripts]
carefulwhisper = "backend.main:start"
